name: Actualizar Evangelio diario

on:
  schedule:
    - cron: "30 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-gospel:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: pip install beautifulsoup4
      - name: Obtener el Evangelio de hoy
        run: python scripts/update_gospel.py
      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/evangelio.json
          if git diff --cached --quiet; then
            echo "El Evangelio ya estaba actualizado."
          else
            git commit -m "Actualizar Evangelio diario"
            git push
          fi
